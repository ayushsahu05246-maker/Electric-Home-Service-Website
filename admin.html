<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Day Electric — Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #030712; }
    h1,h2,h3,h4 { font-family: 'Outfit', sans-serif; }

    .card {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.25rem;
      backdrop-filter: blur(12px);
    }

    .gradient-text {
      background: linear-gradient(135deg,#f5a623,#ff6b35,#ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .field {
      background: rgba(30,41,59,0.5);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: .75rem;
      color: #e2e8f0;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
      padding: .75rem 1rem;
      font-size: .875rem;
      outline: none;
    }
    .field:focus {
      border-color: #f5a623;
      box-shadow: 0 0 0 3px rgba(245,166,35,.18);
    }
    .field::placeholder { color: #475569; }

    .btn-primary {
      background: linear-gradient(135deg,#f5a623,#ff6b35);
      color: #000; font-weight: 700; padding: .875rem 1.5rem;
      border-radius: .875rem; border: none; cursor: pointer;
      transition: opacity .2s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      font-size: .9rem;
    }
    .btn-primary:hover { opacity: .92; }
    .btn-primary:active { transform: scale(.98); }

    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      75%{transform:translateX(6px)}
    }
    .shake { animation: shake .15s ease-in-out 0s 2; }

    /* Status badge colors */
    .status-pending   { color:#fbbf24; background:rgba(251,191,36,.1);   border:1px solid rgba(251,191,36,.2); }
    .status-in_progress { color:#60a5fa; background:rgba(96,165,250,.1);  border:1px solid rgba(96,165,250,.2); }
    .status-completed { color:#34d399; background:rgba(52,211,153,.1);  border:1px solid rgba(52,211,153,.2); }
    .status-cancelled { color:#f87171; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.2); }

    .status-sel {
      border-radius: .6rem; padding: .35rem .7rem;
      font-size: .75rem; font-weight: 700;
      cursor: pointer; outline: none; border: 1px solid;
      transition: all .2s;
    }

    /* Booking card hover */
    .booking-card {
      transition: border-color .2s, background .2s;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .booking-card:hover {
      border-color: rgba(59,130,246,0.25);
      background: rgba(37,99,235,0.04);
    }

    /* Filter tabs */
    .filter-tab {
      font-size: .75rem; font-weight: 700; padding: .4rem .9rem;
      border-radius: .75rem; cursor: pointer; transition: all .2s;
      color: #64748b; border: 1px solid transparent;
    }
    .filter-tab:hover { color: #94a3b8; }
    .filter-tab.active { background: rgba(245,166,35,.15); color: #fbbf24; border-color: rgba(245,166,35,.25); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

  <!-- Ambient blobs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 right-0 w-96 h-96 rounded-full bg-blue-900/12 blur-3xl"></div>
    <div class="absolute bottom-0 -left-32 w-80 h-80 rounded-full bg-indigo-900/10 blur-3xl"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-5 right-5 z-50 opacity-0 pointer-events-none transition-all duration-300 translate-y-[-12px] card px-4 py-3 flex items-center gap-3 shadow-xl min-w-[220px]">
    <div id="toastIcon" class="w-7 h-7 rounded-lg flex items-center justify-center bg-emerald-500/15 text-emerald-400 border border-emerald-500/20 shrink-0"></div>
    <div>
      <p class="text-xs font-bold text-white" id="toastTitle"></p>
      <p class="text-[10px] text-slate-400" id="toastMsg"></p>
    </div>
  </div>

  <!-- Map Modal -->
  <div id="mapModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur opacity-0 pointer-events-none transition-all duration-300">
    <div class="card w-full max-w-xl m-4 overflow-hidden shadow-2xl">
      <div class="flex items-center justify-between px-5 py-4 border-b border-white/5">
        <p class="font-bold text-white flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-blue-400"></i> Booking Location</p>
        <button onclick="closeMap()" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <div class="p-5">
        <iframe id="modalMapFrame" class="w-full h-72 rounded-xl border border-white/10" loading="lazy"></iframe>
        <div class="mt-3 flex justify-between items-center text-xs text-slate-400">
          <span id="modalCoords"></span>
          <a id="modalMapsLink" target="_blank" class="text-blue-400 hover:text-blue-300 font-semibold">Open Google Maps →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="relative z-10 sticky top-0 border-b border-white/5 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/30">
          <i data-lucide="zap" class="w-5 h-5 text-white font-bold"></i>
        </div>
        <div>
          <p class="font-black text-sm text-white leading-none">One Day Electric</p>
          <p class="text-[10px] font-semibold text-orange-400 tracking-widest leading-none uppercase">Admin Portal</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/5 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Customer Site
        </a>
        <button id="logoutBtn" class="hidden text-xs font-semibold text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/15 border border-red-500/20 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="relative z-10 max-w-7xl mx-auto px-5 py-8 w-full flex-grow flex flex-col">

    <!-- LOGIN SCREEN -->
    <section id="loginScreen" class="flex items-center justify-center flex-grow">
      <div class="card p-8 w-full max-w-sm" id="loginCard">
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-orange-500/10 border border-orange-500/20 text-orange-400 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="lock" class="w-7 h-7"></i>
          </div>
          <h2 class="text-xl font-bold text-white">One Day Electric Admin</h2>
          <p class="text-xs text-slate-400 mt-1">Enter your PIN to access the booking dashboard</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Portal PIN</label>
            <input id="pinInput" type="password" class="field text-center text-2xl tracking-[.5em] font-mono" placeholder="••••" maxlength="8" />
          </div>
          <button id="loginBtn" class="btn-primary w-full">
            <i data-lucide="log-in" class="w-4 h-4"></i> Sign In
          </button>
          <p id="loginMsg" class="text-center text-xs text-slate-400 min-h-[1rem]"></p>
        </div>
      </div>
    </section>

    <!-- DASHBOARD SCREEN -->
    <section id="dashScreen" class="hidden flex-col gap-6">

      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="card p-4 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 border border-white/5 flex items-center justify-center shrink-0">
            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Total</p>
            <p id="stTotal" class="text-2xl font-extrabold text-white">0</p>
          </div>
        </div>
        <div class="card p-4 flex items-center gap-3 border-amber-500/10">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center shrink-0">
            <i data-lucide="clock" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Pending</p>
            <p id="stPending" class="text-2xl font-extrabold text-amber-400">0</p>
          </div>
        </div>
        <div class="card p-4 flex items-center gap-3 border-blue-500/10">
          <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center shrink-0">
            <i data-lucide="activity" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">In Progress</p>
            <p id="stProgress" class="text-2xl font-extrabold text-blue-400">0</p>
          </div>
        </div>
        <div class="card p-4 flex items-center gap-3 border-emerald-500/10">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center shrink-0">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Completed</p>
            <p id="stCompleted" class="text-2xl font-extrabold text-emerald-400">0</p>
          </div>
        </div>
      </div>

      <!-- Search & Filter bar -->
      <div class="card p-4 flex flex-col sm:flex-row gap-3 items-center">
        <div class="relative w-full sm:max-w-sm">
          <input id="searchInput" type="text" class="field pl-9" placeholder="Search name, phone, ID, service…" />
          <i data-lucide="search" class="absolute left-3 top-3.5 w-3.5 h-3.5 text-slate-500"></i>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="pending">⏳ Pending</button>
          <button class="filter-tab" data-filter="in_progress">⚡ In Progress</button>
          <button class="filter-tab" data-filter="completed">✅ Completed</button>
          <button class="filter-tab" data-filter="cancelled">✗ Cancelled</button>
        </div>
      </div>

      <!-- Bookings list -->
      <div id="bookingsList" class="flex flex-col gap-3"></div>
      <p id="dashMsg" class="text-xs text-slate-500 text-center"></p>
    </section>
  </main>

  <footer class="relative z-10 border-t border-white/5 mt-auto py-5 text-center text-xs text-slate-600">
    &copy; 2026 EVOLT Admin Center — Authorized Access Only
  </footer>

  <script>
    const STATUS_OPTIONS = ['pending','in_progress','completed','cancelled'];
    const ICON_MAP = { 'fan-repair':'fan','switch-socket':'plug','wiring':'zap','ac-repair':'snowflake','geyser':'droplet','inverter':'battery-charging','lighting':'lightbulb','mcb-fuse':'shield-alert','doorbell':'bell','appliance':'tv','stabilizer':'gauge','emergency':'siren' };
    const s = { bookings: [], filter: 'all', search: '', whatsapp: '9454386338' };

    function formatDate(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        // Display in IST (India Standard Time, UTC+5:30)
        return d.toLocaleString('en-IN', {
          timeZone: 'Asia/Kolkata',
          year: 'numeric', month: 'short', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: true
        });
      } catch { return iso; }
    }

    function statusClass(st) {
      return `status-${st}`;
    }

    // Toast
    function toast(title, msg, err=false) {
      const t = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMsg').textContent = msg;
      const ic = document.getElementById('toastIcon');
      if (err) {
        ic.className = 'w-7 h-7 rounded-lg flex items-center justify-center bg-red-500/15 text-red-400 border border-red-500/20 shrink-0';
        ic.innerHTML = '<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>';
      } else {
        ic.className = 'w-7 h-7 rounded-lg flex items-center justify-center bg-emerald-500/15 text-emerald-400 border border-emerald-500/20 shrink-0';
        ic.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i>';
      }
      lucide.createIcons();
      t.classList.remove('opacity-0','pointer-events-none','translate-y-[-12px]');
      t.classList.add('opacity-100','translate-y-0');
      setTimeout(()=>{ t.classList.add('opacity-0','pointer-events-none','translate-y-[-12px]'); t.classList.remove('opacity-100','translate-y-0'); }, 3000);
    }

    // Map modal
    function openMap(lat, lng) {
      const q=`${lat},${lng}`;
      document.getElementById('modalMapFrame').src=`https://maps.google.com/maps?q=${q}&z=15&output=embed`;
      document.getElementById('modalCoords').textContent=`GPS: ${q}`;
      document.getElementById('modalMapsLink').href=`https://www.google.com/maps?q=${q}`;
      const m=document.getElementById('mapModal');
      m.classList.remove('opacity-0','pointer-events-none');
    }
    function closeMap() {
      const m=document.getElementById('mapModal');
      m.classList.add('opacity-0','pointer-events-none');
      setTimeout(()=>document.getElementById('modalMapFrame').src='', 300);
    }

    // Auth
    async function checkAuth() {
      try {
        const r = await fetch('/api/admin/me');
        if (!r.ok) throw new Error();
        showDash();
      } catch { showLogin(); }
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashScreen').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
    }
    function showDash() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashScreen').classList.remove('hidden');
      document.getElementById('dashScreen').classList.add('flex');
      document.getElementById('logoutBtn').classList.remove('hidden');
      loadDash();
    }

    async function login() {
      const pin = document.getElementById('pinInput').value.trim();
      const msg = document.getElementById('loginMsg');
      msg.textContent = 'Verifying…'; msg.className = 'text-center text-xs text-blue-400';
      try {
        const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin}) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Wrong PIN');
        toast('Access Granted', 'Welcome back, Admin.');
        setTimeout(showDash, 400);
      } catch (e) {
        msg.textContent = e.message; msg.className = 'text-center text-xs text-red-400';
        const card = document.getElementById('loginCard');
        card.classList.add('shake');
        setTimeout(()=>card.classList.remove('shake'), 400);
      }
    }

    async function loadDash() {
      const msg = document.getElementById('dashMsg');
      msg.textContent = 'Loading…';
      try {
        const [sr, br, svr] = await Promise.all([ fetch('/api/bookings/stats'), fetch('/api/bookings'), fetch('/api/services') ]);
        if (!sr.ok || !br.ok) throw new Error('Failed to load data');
        const stats = await sr.json();
        const bookings = await br.json();
        if (svr.ok) { const sv = await svr.json(); s.whatsapp = sv.whatsapp || '9454386338'; }

        document.getElementById('stTotal').textContent = stats.total || 0;
        document.getElementById('stPending').textContent = stats.pending || 0;
        document.getElementById('stProgress').textContent = stats.in_progress || 0;
        document.getElementById('stCompleted').textContent = stats.completed || 0;

        s.bookings = bookings.bookings || [];
        renderBookings();
      } catch (e) {
        msg.textContent = `Error: ${e.message}`;
        toast('Load Failed', e.message, true);
      }
    }

    function renderBookings() {
      let list = [...s.bookings];
      if (s.filter !== 'all') list = list.filter(b => b.status === s.filter);
      if (s.search) {
        const q = s.search.toLowerCase();
        list = list.filter(b => [b.booking_id, b.customer_name, b.phone, b.address, b.service_title].some(v => (v||'').toLowerCase().includes(q)));
      }

      const container = document.getElementById('bookingsList');
      const msg = document.getElementById('dashMsg');

      if (!list.length) {
        container.innerHTML = `<div class="card py-14 text-center text-slate-500 flex flex-col items-center gap-2"><i data-lucide="inbox" class="w-8 h-8 opacity-40"></i><p>No bookings found</p></div>`;
        msg.textContent = '';
        lucide.createIcons();
        return;
      }

      container.innerHTML = list.map(b => {
        const icon = ICON_MAP[b.service_id] || 'zap';
        const phone = (b.phone||'').replace(/\D/g,'');
        const waMsg = encodeURIComponent(`Hello ${b.customer_name}, this is EVOLT Electric. Regarding your booking ${b.booking_id} for ${b.service_title}.`);
        const waLink = phone ? `https://wa.me/91${phone}?text=${waMsg}` : '#';
        const mapBtn = b.latitude && b.longitude
          ? `<button onclick="openMap(${b.latitude},${b.longitude})" class="flex items-center gap-1 text-xs text-blue-400 hover:text-blue-300 font-semibold bg-blue-500/10 px-2 py-1 rounded-lg border border-blue-500/20 transition"><i data-lucide="map" class="w-3 h-3"></i> Map</button>`
          : `<span class="text-xs text-slate-600">No GPS</span>`;

        const scClass = `status-sel ${statusClass(b.status)}`;
        return `
          <div class="card booking-card p-5 flex flex-col md:flex-row gap-4 md:items-center justify-between rounded-2xl">
            <!-- Left: service + booking info -->
            <div class="flex items-start gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-blue-600/10 border border-blue-500/15 text-blue-400 flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="${icon}" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-mono text-xs font-bold text-blue-400 select-all">${b.booking_id}</span>
                  <span class="text-[10px] text-slate-500">${formatDate(b.created_at)}</span>
                </div>
                <p class="font-bold text-white text-sm mt-0.5">${b.service_title||'-'}</p>
                <p class="text-xs text-slate-400 mt-0.5 truncate max-w-xs">${b.address||'-'}</p>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wide">${b.city||''} ${b.pincode||''}</p>
                ${b.notes ? `<p class="text-[10px] text-amber-400/70 mt-0.5 max-w-xs line-clamp-1">📝 ${b.notes}</p>` : ''}
              </div>
            </div>

            <!-- Middle: contacts -->
            <div class="flex flex-col gap-1.5 shrink-0">
              <p class="font-semibold text-white text-sm">${b.customer_name||'-'}</p>
              <a href="tel:${b.phone}" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
                <i data-lucide="phone" class="w-3 h-3"></i> ${b.phone||'-'}
              </a>
              <a href="${waLink}" target="_blank" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1 font-semibold transition">
                <i data-lucide="message-square" class="w-3 h-3"></i> WhatsApp
              </a>
              ${b.email ? `<a href="mailto:${b.email}" class="text-xs text-blue-300 hover:text-blue-200 flex items-center gap-1 transition"><i data-lucide="mail" class="w-3 h-3"></i> ${b.email}</a>` : '<span class="text-[10px] text-slate-600 flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3"></i> No email</span>'}
              ${b.preferred_time ? `<p class="text-[10px] text-slate-500 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${b.preferred_time}</p>` : ''}
            </div>

            <!-- Right: map + status -->
            <div class="flex flex-col items-start md:items-end gap-2 shrink-0">
              ${mapBtn}
              <div>
                <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mb-1">Status</p>
                <select data-id="${b.booking_id}" class="${scClass}">
                  ${STATUS_OPTIONS.map(st => `<option value="${st}" ${st===b.status?'selected':''} class="bg-slate-950 text-slate-100">${st.replace('_',' ')}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>`;
      }).join('');

      // Status change listeners
      container.querySelectorAll('.status-sel').forEach(sel => {
        sel.addEventListener('change', async ev => {
          const id = ev.target.getAttribute('data-id');
          const ns = ev.target.value;
          try {
            const r = await fetch(`/api/bookings/${id}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:ns}) });
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail||'Failed');
            toast('Updated', `${id} → ${ns.replace('_',' ')}`);
            loadDash();
          } catch (e) { toast('Error', e.message, true); }
        });
      });

      msg.textContent = `Showing ${list.length} of ${s.bookings.length} bookings`;
      lucide.createIcons();
    }

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        s.filter = tab.getAttribute('data-filter');
        renderBookings();
      });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', e => {
      s.search = e.target.value;
      renderBookings();
    });

    // Logout
    async function logout() {
      await fetch('/api/admin/logout', {method:'POST'});
      toast('Logged out', 'Session ended.');
      showLogin();
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key==='Enter') login(); });

    checkAuth();
  </script>
</body>
</html>
